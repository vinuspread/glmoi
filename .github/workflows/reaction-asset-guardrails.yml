name: Reaction Asset Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  reaction-asset-guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify reaction asset references
        run: bash scripts/verify_reaction_asset_refs.sh

      - name: Detect reaction asset changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "reaction_assets_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "${{ github.sha }}" > /tmp/changed_files.txt

          if grep -q '^assets/icons/reactions/' /tmp/changed_files.txt; then
            echo "reaction_assets_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "reaction_assets_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce clean build and reaction popup widget test
        if: steps.changes.outputs.reaction_assets_changed == 'true'
        run: |
          flutter clean
          flutter pub get
          flutter test test/features/reactions/presentation/reaction_bottom_sheet_test.dart
          flutter build apk --debug --flavor prod
